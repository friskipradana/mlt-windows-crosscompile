name: Build MLT for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. System info
      # ─────────────────────────────────────────────
      - name: System info
        run: |
          echo "===== CPU =====" && nproc
          echo "===== RAM =====" && free -h
          echo "===== DISK ====" && df -h

      # ─────────────────────────────────────────────
      # 3. Install tools
      # FIX: tambah "wine" + "wine32:i386" di sini sekalian (bukan step
      # terpisah nanti) supaya apt cache/update tidak dobel jalan, dan
      # kalau gagal install wine, build langsung ketahuan gagal dari awal
      # bukan baru gagal di step smoke test paling akhir.
      # ─────────────────────────────────────────────
      - name: Install build tools
        run: |
          set -ex
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64 \
            cmake \
            make \
            ninja-build \
            meson \
            nasm \
            yasm \
            pkg-config \
            autoconf \
            automake \
            libtool \
            gettext \
            gperf \
            git \
            wget \
            zip \
            tree \
            python3 \
            python3-pip \
            libffi-dev \
            libglib2.0-dev \
            wine wine64 wine32:i386

      # ─────────────────────────────────────────────
      # 4. Cache deps
      # FIX: bump cache key ke v3 karena build-all-ubuntu.sh berubah
      # (-static-libgcc/-static-libstdc++ ditambahkan di semua tahap).
      # Cache lama (v2) dibuild TANPA flag ini, jadi kalau tetap dipakai,
      # semua dependency yang sudah ke-cache (zlib, glib, ffmpeg, dst)
      # tidak akan ke-rebuild dan hasilnya tetap dynamic-link ke libgcc/
      # libstdc++ seperti sebelumnya -- fix ini jadi percuma. hashFiles
      # sebenarnya sudah otomatis beda kalau isi file berubah, tapi bump
      # versi manual dibuat eksplisit di sini supaya jelas terlihat di log
      # cache mana yang dipakai.
      # ─────────────────────────────────────────────
      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/tools/win-deps
            ~/tools/src
          key: mlt-deps-v3-${{ runner.os }}-${{ hashFiles('build-all-ubuntu.sh') }}
          restore-keys: |
            mlt-deps-v3-${{ runner.os }}-

      # ─────────────────────────────────────────────
      # 5. Init dirs (hanya kalau cache miss)
      # ─────────────────────────────────────────────
      - name: Init dirs
        run: |
          mkdir -p $HOME/tools/win-deps/lib \
                   $HOME/tools/win-deps/bin \
                   $HOME/tools/win-deps/include \
                   $HOME/tools/src

      # ─────────────────────────────────────────────
      # 6. Build
      # build-all-ubuntu.sh SUDAH generate run_melt.ps1 yang robust
      # (deteksi lokasi melt.exe fleksibel, deteksi STATUS_DLL_NOT_FOUND,
      # tanpa pipe "echo "" |" yang lama) langsung ke $PREFIX/run_melt.ps1.
      # JANGAN generate ulang versi lain di workflow -- itu cuma bikin
      # dua sumber kebenaran yang gampang saling menimpa dan salah satu
      # (yang lebih basic/lama) berakhir ke-package alih-alih yang bagus.
      # ─────────────────────────────────────────────
      - name: Build
        run: |
          set -ex
          chmod +x build-all-ubuntu.sh
          ./build-all-ubuntu.sh

      # ─────────────────────────────────────────────
      # 7.1 Show folder structure
      # ─────────────────────────────────────────────
      - name: Show folder structure
        run: |
          echo "=== ~/tools/ ==="
          tree $HOME/tools/ -L 1

      # ─────────────────────────────────────────────
      # 7.2 Show folder structure win-deps
      # ─────────────────────────────────────────────
      - name: Show folder structure win-deps
        run: |
          echo "=== ~/tools/win-deps ==="
          tree $HOME/tools/win-deps -L 2

      # ─────────────────────────────────────────────
      # 7.3 Show folder structure src
      # ─────────────────────────────────────────────
      - name: Show folder structure src
        run: |
          echo "=== ~/tools/src ==="
          tree $HOME/tools/src -L 1

      # ─────────────────────────────────────────────
      # 7.4 Show folder structure src/mlt-win
      # ─────────────────────────────────────────────
      - name: Show folder structure src/mlt-win
        run: |
          echo "=== ~/tools/src/mlt-win/build ==="
          tree $HOME/tools/src/mlt-win/build -L 3

      # ─────────────────────────────────────────────
      # 8. Validate output
      # FIX: cek jumlah DLL modul, bukan cuma keberadaan folder -- folder
      # bisa saja ada (dari mkdir -p) tapi KOSONG, dan "ls" tetap exit 0
      # untuk folder kosong sehingga tidak akan gagal-cepat tanpa cek ini.
      # ─────────────────────────────────────────────
      - name: Validate output
        run: |
          PREFIX="$HOME/tools/win-deps"
          echo "=== Checking melt.exe ==="
          ls -lh "$PREFIX/bin/melt.exe" || { echo "❌ melt.exe NOT FOUND"; exit 1; }

          echo "=== DLLs ==="
          ls "$PREFIX/bin/"*.dll | wc -l

          echo "=== MLT modules ==="
          MOD_COUNT=$(find "$PREFIX/lib/mlt" -maxdepth 1 -name "*.dll" 2>/dev/null | wc -l)
          echo "Jumlah modul DLL: $MOD_COUNT"
          if [ "$MOD_COUNT" -eq 0 ]; then
            echo "❌ lib/mlt KOSONG -- melt.exe tidak akan bisa load modul apapun!"
            find "$PREFIX/lib/mlt" -type f 2>/dev/null || echo "(folder lib/mlt tidak ada sama sekali)"
            exit 1
          fi
          ls "$PREFIX/lib/mlt/"

          echo "=== MLT share/profiles ==="
          if [ ! -d "$PREFIX/share/mlt/profiles" ]; then
            echo "❌ share/mlt/profiles tidak ditemukan!"
            exit 1
          fi
          ls "$PREFIX/share/mlt/"

          echo "=== run_melt.ps1 dari build script ==="
          ls -lh "$PREFIX/run_melt.ps1" || { echo "❌ run_melt.ps1 tidak ditemukan di \$PREFIX!"; exit 1; }

      # ─────────────────────────────────────────────
      # 8.1 Dump DLL dependencies (debug, selalu jalan)
      # FIX BARU: pakai objdump untuk lihat semua DLL yang melt.exe minta.
      # Kalau ternyata masih ada libgcc_s_seh-1.dll / libstdc++-6.dll di
      # sini padahal -static-libgcc/-static-libstdc++ sudah dipasang,
      # berarti ada satu jalur compile yang belum kena flag itu -- akan
      # kelihatan jelas di log, tidak perlu tebak-tebakan lagi.
      # ─────────────────────────────────────────────
      - name: Dump melt.exe DLL dependencies
        run: |
          PREFIX="$HOME/tools/win-deps"
          echo "=== melt.exe dependencies ==="
          x86_64-w64-mingw32-objdump -p "$PREFIX/bin/melt.exe" | grep -i "DLL Name"
          echo ""
          echo "=== DLL yang tersedia di package (bin/) ==="
          ls "$PREFIX/bin/"*.dll | xargs -n1 basename | sort
          echo ""
          echo "=== Subsystem melt.exe (HARUS 'Windows CUI', kalau 'Windows GUI' -> blank di PowerShell) ==="
          SUBSYS=$(x86_64-w64-mingw32-objdump -p "$PREFIX/bin/melt.exe" | grep -i "^Subsystem")
          echo "$SUBSYS"
          if echo "$SUBSYS" | grep -qi "GUI"; then
            echo "❌ melt.exe adalah Windows GUI subsystem -- akan blank total di Windows!"
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 8.2 Smoke test melt.exe dengan Wine
      # FIX BARU: langkah ini sebelumnya TIDAK ADA -- validasi lama cuma
      # cek file exist, bukan cek melt.exe benar-benar bisa START & LOAD
      # MODUL di lingkungan mirip-Windows (lewat Wine). Kalau DLL runtime
      # GCC hilang (libgcc_s_seh-1.dll dkk, root cause paling mungkin dari
      # gejala "melt.exe diam total" yang kamu alami), step ini akan
      # gagal SEKARANG di CI -- bukan baru ketahuan setelah kamu download
      # & jalankan manual di Windows asli.
      # ─────────────────────────────────────────────
      - name: Smoke test melt.exe with Wine
        run: |
          set -ex
          PREFIX="$HOME/tools/win-deps"
          export WINEDEBUG=-all
          export WINEARCH=win64
          export MLT_REPOSITORY="$PREFIX/lib/mlt"
          export MLT_DATA="$PREFIX/share/mlt"
          export MLT_PROFILES_PATH="$PREFIX/share/mlt/profiles"
          export WINEPATH="$PREFIX/bin"

          echo "=== melt -version ==="
          wine "$PREFIX/bin/melt.exe" -version || { echo "❌ melt.exe GAGAL start di Wine (kemungkinan besar: DLL runtime hilang, cek step 'Dump melt.exe DLL dependencies' di atas)"; exit 1; }

          echo "=== melt -query consumers (cek modul ke-load) ==="
          wine "$PREFIX/bin/melt.exe" -query "consumers" 2>&1 | tee /tmp/melt-query.log
          if ! grep -qi "avformat" /tmp/melt-query.log; then
            echo "❌ Modul avformat tidak ke-load -- cek dependency FFmpeg DLL di lib/mlt/"
            exit 1
          fi
          echo "✅ melt.exe berhasil start dan modul ter-load di Wine"

      # ─────────────────────────────────────────────
      # 10. Package
      # FIX UTAMA:
      #   1. Modul DLL di-copy dari $PREFIX/lib/mlt (lokasi asli hasil
      #      install), BUKAN dari $PREFIX/bin (yang cuma berisi 2 file
      #      core: libmlt-6.dll & libmlt++-3.dll, modul lain TIDAK ada
      #      di situ -- ini bug lama yang bikin lib/mlt kosong di zip).
      #   2. run_melt.ps1 di-copy dari $PREFIX/run_melt.ps1 (versi robust
      #      hasil build-all-ubuntu.sh), BUKAN generate ulang versi basic
      #      terpisah di workflow yang akhirnya menimpa versi bagus.
      # ─────────────────────────────────────────────
      - name: Package
        run: |
          set -ex

          PREFIX="$HOME/tools/win-deps"
          OUT="release-output"
          ZIP="mlt-windows.zip"

          find "$HOME/tools" -type f -iname "*.zip" -delete || true

          rm -rf "$OUT"
          rm -f "$ZIP"

          mkdir -p "$OUT/bin" "$OUT/lib/mlt" "$OUT/share"

          # FIX (root cause "no plugins found di path yang salah"): MLT di
          # Windows menghitung ULANG prefix-nya sendiri dari lokasi melt.exe
          # (GetModuleFileName), dengan ASUMSI struktur baku <prefix>\bin\
          # melt.exe -- lalu logic ini MENG-OVERWRITE MLT_REPOSITORY yang
          # sudah kita set lewat env var, bukan cuma fallback kalau kosong.
          # Sebelumnya melt.exe diratakan ke $OUT/ root (bukan $OUT/bin/),
          # sehingga MLT salah hitung prefix (naik 1 folder terlalu jauh)
          # dan nyari lib/mlt di folder PARENT project, bukan di project
          # itu sendiri. FIX: taruh melt.exe & SEMUA dll di bin/, persis
          # sama seperti struktur $PREFIX asli (yang terbukti jalan pas
          # smoke test Wine) -- prefix/bin/melt.exe + prefix/lib/mlt +
          # prefix/share/mlt sebagai sibling dari bin/.
          cp "$PREFIX/bin/melt.exe" "$OUT/bin/"

          # lib/mlt: MLT module DLLs -- FIX: copy dari $PREFIX/lib/mlt,
          # lokasi asli hasil install, bukan dari $PREFIX/bin.
          cp "$PREFIX/lib/mlt/"*.dll "$OUT/lib/mlt/"

          MOD_COUNT=$(find "$OUT/lib/mlt" -maxdepth 1 -name "*.dll" | wc -l)
          echo ">>> Modul yang ke-copy ke package: $MOD_COUNT"
          if [ "$MOD_COUNT" -eq 0 ]; then
            echo "❌ Tidak ada modul ke-copy ke \$OUT/lib/mlt! Package dibatalkan."
            exit 1
          fi

          # bin: SEMUA DLL (termasuk core libmlt-6.dll/libmlt++-3.dll) --
          # FIX: sebelumnya core DLL dipisah ke root, sekarang semua tetap
          # di bin/ bersama melt.exe supaya struktur match asumsi MLT.
          find "$PREFIX/bin" -maxdepth 1 -name "*.dll" -exec cp {} "$OUT/bin/" \;

          # share
          if [ -d "$PREFIX/share/mlt" ]; then
            cp -r "$PREFIX/share/mlt" "$OUT/share/"
          else
            echo "❌ \$PREFIX/share/mlt tidak ditemukan! Package dibatalkan."
            exit 1
          fi

          # run script -- FIX: ambil dari $PREFIX (hasil build-all-ubuntu.sh
          # yang sudah robust), bukan dari file terpisah di workspace root.
          if [ -f "$PREFIX/run_melt.ps1" ]; then
            cp "$PREFIX/run_melt.ps1" "$OUT/"
          else
            echo "❌ \$PREFIX/run_melt.ps1 tidak ditemukan! Cek generate_run_melt_script() di build-all-ubuntu.sh."
            exit 1
          fi

          # FIX BARU: ikut package run_melt.bat -- wrapper supaya user tidak
          # perlu ubah PowerShell execution policy atau ketik -ExecutionPolicy
          # Bypass manual tiap kali mau jalankan run_melt.ps1.
          if [ -f "$PREFIX/run_melt.bat" ]; then
            cp "$PREFIX/run_melt.bat" "$OUT/"
          else
            echo "⚠️  \$PREFIX/run_melt.bat tidak ditemukan, skip (bukan fatal)."
          fi

          find "$OUT" -type f -iname "*.zip" -delete

          echo "=== Struktur output ==="
          tree "$OUT" -L 3 || true

          (
            cd "$OUT"
            zip -r "../$ZIP" . -x "*.zip"
          )

          echo "=== Isi ZIP ==="
          unzip -l "$ZIP"

          echo "=== Sanity check: pastikan lib/mlt/*.dll ada di dalam ZIP ==="
          ZIP_MOD_COUNT=$(unzip -l "$ZIP" | grep -c "lib/mlt/.*\.dll")
          echo "Modul di dalam ZIP: $ZIP_MOD_COUNT"
          if [ "$ZIP_MOD_COUNT" -eq 0 ]; then
            echo "❌ ZIP tidak berisi modul apapun di lib/mlt/!"
            exit 1
          fi

          echo "=== Sanity check: melt.exe HARUS di bin/, BUKAN di root ==="
          # FIX: cek eksplisit supaya kalau ada yang tanpa sadar flatten lagi
          # di masa depan, build langsung gagal jelas -- bukan silent bug
          # yang baru ketahuan lagi setelah user download & test di Windows.
          if unzip -l "$ZIP" | grep -qE "^\s*[0-9]+.*[[:space:]]melt\.exe$"; then
            echo "❌ Ada melt.exe di ROOT zip! Ini akan bikin MLT salah hitung"
            echo "   prefix path lagi (lihat komentar FIX di step Package)."
            exit 1
          fi
          unzip -l "$ZIP" | grep -i "bin/melt.exe" || { echo "❌ bin/melt.exe tidak ditemukan di ZIP!"; exit 1; }

          ls -lh "$ZIP"

      # ─────────────────────────────────────────────
      # 11. Upload artifact (manual dispatch)
      # ─────────────────────────────────────────────
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mlt-windows
          path: mlt-windows.zip

      # ─────────────────────────────────────────────
      # 12. GitHub Release (tag push)
      # ─────────────────────────────────────────────
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mlt-windows.zip
          body: |
            MLT Windows Cross Build
            - Ubuntu + MinGW-w64
            - Built from: ${{ github.sha }}
